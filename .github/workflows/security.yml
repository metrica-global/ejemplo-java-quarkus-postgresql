# Security checks: static analysis of the Java code, dependencies, secrets and
# infrastructure as code.
#
# Everything runs with a read-only token. SonarQube and Snyk are optional:
# their jobs run only when the repository has the token, so a fork, a
# Dependabot pull request or a repository without those secrets skips them
# instead of failing.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories are published for code that did not change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Which optional tools can run. Secrets cannot be read in a job-level `if`,
  # so this job turns "the secret exists" into outputs the other jobs test.
  # ---------------------------------------------------------------------------
  config:
    name: optional tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sonarqube: ${{ steps.detect.outputs.sonarqube }}
      snyk: ${{ steps.detect.outputs.snyk }}
      gitleaks: ${{ steps.detect.outputs.gitleaks }}
    steps:
      - name: Detect the configured tokens
        id: detect
        env:
          # Only whether each secret exists. The values never reach this step.
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
          HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
          HAS_GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # gitleaks-action needs a license key when the repository belongs to
          # an organization and none when it belongs to a personal account.
          owner_type="$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type || echo unknown)"
          if [ "$HAS_GITLEAKS_LICENSE" = "true" ] || [ "$owner_type" = "User" ]; then
            gitleaks=true
          else
            gitleaks=false
          fi
          {
            echo "sonarqube=${HAS_SONAR_TOKEN}"
            echo "snyk=${HAS_SNYK_TOKEN}"
            echo "gitleaks=${gitleaks}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # CodeQL. Code scanning is free for public repositories; a private one needs
  # GitHub Code Security. Set the repository variable CODE_SECURITY_ENABLED to
  # `false` where it is not available.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (java)
    if: vars.CODE_SECURITY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # required by CodeQL in private repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL resolves the Maven dependencies to type the code it reads. The
      # build requires JDK 25 (enforcer rule in the parent POM).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # build-mode none: the Java sources are analysed without compiling them.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin

  # ---------------------------------------------------------------------------
  # Dependencies added or changed by a pull request, against the advisory
  # database. Needs the dependency graph (same availability as code scanning).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && vars.CODE_SECURITY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Secrets committed to the repository.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret scanning
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the commits, not only the last tree
          persist-credentials: false

      # gitleaks-action scans a push from the PARENT of its first commit. The
      # first push of a repository starts at the root commit, which has no
      # parent, and the action fails on it without scanning anything. That one
      # push is covered by the file scan below.
      - name: Can gitleaks read the commits of this event
        id: range
        env:
          FIRST_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$FIRST_COMMIT" ] &&
            ! git rev-parse --verify --quiet "${FIRST_COMMIT}^" > /dev/null; then
            echo "::notice::This push starts at the first commit of the repository: its files are scanned instead of its commits."
            echo "scannable=false" >> "$GITHUB_OUTPUT"
          else
            echo "scannable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks (commit history)
        if: needs.config.outputs.gitleaks == 'true' && steps.range.outputs.scannable == 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false" # commenting would need write access to pull requests

      # Without the gitleaks license of an organization, or on the first push
      # of a repository, the files of the commit are still scanned. This does
      # not look at earlier commits.
      - name: Trivy secret scan (files of this commit)
        if: needs.config.outputs.gitleaks != 'true' || steps.range.outputs.scannable != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          hide-progress: true

  # ---------------------------------------------------------------------------
  # Infrastructure as code: every Terraform root and the Dockerfile.
  #
  # Each environment is scanned on its own with its terraform.tfvars. Scanning
  # the whole tree at once would not read the tfvars and would report for prod
  # findings that its values already resolve (see infra/terraform/README.md).
  # ---------------------------------------------------------------------------
  iac:
    name: IaC scan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: terraform-bootstrap
            ref: infra/terraform/bootstrap
            tfvars: ""
          - name: terraform-dev
            ref: infra/terraform/envs/dev
            tfvars: infra/terraform/envs/dev/terraform.tfvars
          - name: terraform-qa
            ref: infra/terraform/envs/qa
            tfvars: infra/terraform/envs/qa/terraform.tfvars
          - name: terraform-prod
            ref: infra/terraform/envs/prod
            tfvars: infra/terraform/envs/prod/terraform.tfvars
          - name: dockerfile
            ref: Dockerfile
            tfvars: ""
    env:
      # The report goes to code scanning when it is available and the token can
      # write there (it cannot on a pull request from a fork).
      UPLOAD_SARIF: >-
        ${{ vars.CODE_SECURITY_ENABLED != 'false' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate: readable in the job log, fails on HIGH and CRITICAL.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.ref }}
          tf-vars: ${{ matrix.tfvars }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      # Same scan, all severities, as a report for the Security tab.
      - name: Trivy config scan (SARIF report)
        if: always() && env.UPLOAD_SARIF == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.ref }}
          tf-vars: ${{ matrix.tfvars }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          hide-progress: true

      - name: Upload the report to code scanning
        if: always() && env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # SonarQube (Server or Cloud). Optional: needs the secret SONAR_TOKEN.
  #
  # The analysis of Java needs the compiled classes and reads the JaCoCo
  # reports, so this job runs the same build as CI before the scanner.
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube
    needs: config
    if: needs.config.outputs.sonarqube == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame information and new-code detection
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, tests and coverage
        run: make verify RUN=

      # SonarSource recommends its Maven scanner for Maven projects. This step
      # uses the generic scanner so that the POM does not carry a Sonar plugin;
      # the paths below tell it where the multi-module build left its output.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarQube Server sets SONAR_HOST_URL; without it the scan goes to SonarQube Cloud.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
            -Dsonar.sources=.
            -Dsonar.inclusions=**/src/main/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/src/test/**
            -Dsonar.java.source=25
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.java.test.binaries=**/target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------------------
  # Snyk Open Source. Optional: needs the secret SNYK_TOKEN.
  # ---------------------------------------------------------------------------
  snyk:
    name: Snyk
    needs: config
    if: needs.config.outputs.snyk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Installs the Snyk CLI on the runner, which already has JDK 25. The
      # container actions of snyk/actions bring their own, older JDK.
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Snyk resolves each module with Maven, and the services depend on the
      # libraries of this repository: they must be in the local repository.
      - name: Install the modules into the local Maven repository
        run: ./mvnw -B -ntp -DskipTests install

      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --maven-aggregate-project --severity-threshold=high
