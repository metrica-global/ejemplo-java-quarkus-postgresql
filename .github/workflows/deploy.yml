# Deploys an image that already exists in ECR. Nothing is built here: the tag
# that reached dev is the tag that is promoted to qa and to prod, and each
# environment checks that it resolves to the same digest.
#
#   after a successful build-push on main:  dev -> qa -> prod
#   manual run:                             one environment, one image tag
#
# The manual run is the rollback path (an older tag) and also the last step of
# promoting a module to its own service or bringing it back: the SAME tag is
# deployed again, so that every service starts with the configuration
# Terraform has just changed (infra/terraform/README.md).
#
# There is one image and no list of services here. Which services an
# environment has is read by deploy-environment.yml from a parameter that
# Terraform maintains.
#
# dev deploys on its own. qa and prod wait for the reviewers of their GitHub
# environment. The steps of one environment are in deploy-environment.yml.
name: deploy

on:
  workflow_run:
    workflows: [build-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [dev, qa, prod]
        required: true
      image_tag:
        description: Image tag that already exists in ECR (the commit SHA of a build). To redeploy what is running, the value of the parameter /zonacards/<environment>/release
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # What to deploy: the tag released by the build that just finished, or the
  # one given by hand.
  # ---------------------------------------------------------------------------
  plan:
    name: what to deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the release manifest of the build run
    outputs:
      tag: ${{ steps.manifest.outputs.tag || steps.manual.outputs.tag }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Refuse a manual run outside main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - name: From the release manifest of the build
        id: manifest
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"

          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "release-manifest")] | length')"
          if [ "$count" -eq 0 ]; then
            # No file of the image changed: there is nothing new to deploy.
            echo "::notice::The build run ${BUILD_RUN_ID} released nothing."
            { echo "tag="; echo "digest="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-manifest --dir "$dir"

          # The manifest comes from another workflow run: check its shape
          # before any value is used.
          if ! jq -e '
            (.tag | type == "string" and test("^[0-9a-f]{40}$")) and
            (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' "${dir}/release.json" > /dev/null; then
            echo "::error::release.json of run ${BUILD_RUN_ID} is not a valid release manifest."
            exit 1
          fi

          {
            echo "tag=$(jq -r .tag "${dir}/release.json")"
            echo "digest=$(jq -r .digest "${dir}/release.json")"
          } >> "$GITHUB_OUTPUT"

      - name: From the manual inputs
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid image tag."
            exit 1
          fi
          # No digest to compare with: the tag is resolved in each registry.
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # dev: no approval.
  # ---------------------------------------------------------------------------
  dev:
    needs: plan
    if: >-
      needs.plan.outputs.tag != '' &&
      (github.event_name == 'workflow_run' || inputs.environment == 'dev')
    permissions:
      contents: read
      id-token: write # the deploy role of the environment
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      tag: ${{ needs.plan.outputs.tag }}
      digest: ${{ needs.plan.outputs.digest }}

  # ---------------------------------------------------------------------------
  # qa: after dev, when its reviewers approve.
  # ---------------------------------------------------------------------------
  qa:
    needs: [plan, dev]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' &&
      ((github.event_name == 'workflow_run' && needs.dev.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'qa'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: qa
      tag: ${{ needs.plan.outputs.tag }}
      digest: ${{ needs.plan.outputs.digest }}

  # ---------------------------------------------------------------------------
  # prod: after qa, when its reviewers approve.
  # ---------------------------------------------------------------------------
  prod:
    needs: [plan, qa]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' &&
      ((github.event_name == 'workflow_run' && needs.qa.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      tag: ${{ needs.plan.outputs.tag }}
      digest: ${{ needs.plan.outputs.digest }}
