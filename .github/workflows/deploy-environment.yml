# Deploys one image tag to one environment. Called by deploy.yml, once per
# environment; it is not triggered by any event of its own.
#
# The application is ONE image. An environment runs it as one service (the
# nucleo) or as several (one more per promoted module). Which ones is not
# written in this file: Terraform publishes it in an SSM parameter,
# /zonacards/<environment>/deploy, and this workflow reads it at the start of
# every deployment. Promoting a module changes that parameter; it changes
# neither this file nor a variable in GitHub.
#
# In this order:
#   1. read what to deploy
#   2. check that the tag exists in the registry of the environment and
#      resolves to the expected digest
#   3. register a new revision of the migration task definition and of the
#      task definition of every service, all with the image
#   4. run the ONE migration task of the application and stop here unless its
#      container exits with 0
#   5. roll the services one by one, in the order of the parameter (the
#      services of promoted modules first, the nucleo last), and stop at the
#      first one that fails
#   6. record the tag as the release of the environment
#
# Terraform creates the services and ignores their task definition: every
# deployment registers a revision here, starting from the LATEST revision of
# the family. That is how a change Terraform made to the configuration of a
# service (for example the modules the nucleo serves) reaches the service.
name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev, qa or prod). Its deploy role trusts only jobs of this environment.
        type: string
        required: true
      tag:
        description: Image tag to deploy
        type: string
        required: true
      digest:
        description: Digest the tag must resolve to. Empty skips the comparison.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MIGRATION_TIMEOUT_MINUTES: "30"
  ROLLOUT_TIMEOUT_MINUTES: "30"

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # One migration and up to a handful of rollouts, each with its own timeout.
    timeout-minutes: 240
    # Required reviewers and the allowed branches are configured on the
    # environment in GitHub. The job does not start until they are satisfied.
    environment: ${{ inputs.environment }}
    # One deployment at a time per environment. A newer run waits for the one
    # in progress and replaces an older one that is still waiting.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write # assume the deploy role of the environment
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
      # Both written by Terraform (infra/terraform, output deploy_parameters).
      DEPLOY_PARAMETER: /zonacards/${{ inputs.environment }}/deploy
      RELEASE_PARAMETER: /zonacards/${{ inputs.environment }}/release
    steps:
      - name: Check the configuration of the environment
        env:
          # Named after the variables they come from, for the messages below.
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::The variable ${name} is not set for the environment ${ENVIRONMENT} (see docs/cicd.md)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ inputs.environment }}-${{ github.run_id }}

      # The services of the environment, in the order they are deployed. The
      # file written here is what every later step reads.
      - name: Read what to deploy
        id: cfg
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          descriptor="${RUNNER_TEMP}/deploy.json"

          if ! aws ssm get-parameter --name "$DEPLOY_PARAMETER" --query Parameter.Value --output text > "$descriptor"; then
            echo "::error::${DEPLOY_PARAMETER} could not be read. Terraform creates it with the environment (infra/terraform/README.md)."
            exit 1
          fi

          # The value comes from outside this repository: check its shape
          # before anything in it is used.
          if ! jq -e '
            def id: type == "string" and test("^[A-Za-z0-9_./:-]+$");
            (.cluster | id) and (.repository | id) and (.repository_url | id) and (.container | id) and
            (.subnets | type == "array" and length > 0 and all(.[]; id)) and
            (.migrate | type == "object" and
              (.task_definition_family | id) and (.security_group_id | id) and (.log_group | id)) and
            (.services | type == "array" and length > 0 and
              all(.[];
                (.name | id) and (.service | id) and (.task_definition_family | id) and
                (.modules | type == "string" and test("^[a-z0-9_]+(,[a-z0-9_]+)*$")))) and
            ([.services[].name] | unique | length) == (.services | length)
          ' "$descriptor" > /dev/null; then
            echo "::error::${DEPLOY_PARAMETER} is not a valid deploy descriptor."
            exit 1
          fi

          {
            echo "cluster=$(jq -r .cluster "$descriptor")"
            echo "container=$(jq -r .container "$descriptor")"
            echo "repository=$(jq -r .repository "$descriptor")"
            echo "image=$(jq -r .repository_url "$descriptor"):${TAG}"
            echo "subnets=$(jq -r '.subnets | join(",")' "$descriptor")"
            echo "migrate_family=$(jq -r .migrate.task_definition_family "$descriptor")"
            echo "migrate_security_group=$(jq -r .migrate.security_group_id "$descriptor")"
            echo "migrate_log_group=$(jq -r .migrate.log_group "$descriptor")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deployment to ${ENVIRONMENT}"
            echo
            echo "Tag \`${TAG}\`. Services, in the order they are deployed:"
            echo
            echo "| | Service | Modules it serves |"
            echo "|---:|---|---|"
            jq -r '.services | to_entries[] | "| \(.key + 1) | `\(.value.service)` | `\(.value.modules)` |"' "$descriptor"
          } >> "$GITHUB_STEP_SUMMARY"

      # Promotion never rebuilds. The tag must already exist in the registry of
      # this environment and, when the build reported a digest, be that image.
      - name: Check the image
        id: image
        env:
          REPOSITORY: ${{ steps.cfg.outputs.repository }}
          IMAGE: ${{ steps.cfg.outputs.image }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if ! digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=${TAG}" \
            --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
            printf '%s\n' "$digest" >&2
            echo "::error::${IMAGE} was not found in the registry of ${ENVIRONMENT}."
            exit 1
          fi
          if [ -n "$EXPECTED_DIGEST" ] && [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::${IMAGE} resolves to ${digest}, but the build published ${EXPECTED_DIGEST}."
            exit 1
          fi
          echo "${IMAGE} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # A new revision is the latest one of the family with a different image.
      # Everything else (roles, variables, secrets, sizes, tags) is kept, so a
      # change that Terraform made to the family reaches the service here.
      # Nothing is deployed yet: registering a revision changes no service.
      - name: Register the task definitions
        id: register
        env:
          CONTAINER_NAME: ${{ steps.cfg.outputs.container }}
          MIGRATE_FAMILY: ${{ steps.cfg.outputs.migrate_family }}
          IMAGE: ${{ steps.cfg.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          descriptor="${RUNNER_TEMP}/deploy.json"
          revisions="${RUNNER_TEMP}/revisions.json"

          register() {
            local family="$1" current next
            current="${RUNNER_TEMP}/${family}.current.json"
            next="${RUNNER_TEMP}/${family}.next.json"

            aws ecs describe-task-definition --task-definition "$family" --include TAGS --output json > "$current"

            # Replace the image of the container and drop the fields that
            # describe a registered revision and cannot be sent back.
            jq --arg container "$CONTAINER_NAME" --arg image "$IMAGE" '
              if any(.taskDefinition.containerDefinitions[]; .name == $container) then . else
                error("the task definition has no container named \($container)")
              end
              | (.tags // []) as $tags
              | .taskDefinition
              | (.containerDefinitions[] | select(.name == $container) | .image) = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy, .deregisteredAt)
              | if ($tags | length) > 0 then .tags = $tags else . end
            ' "$current" > "$next"

            aws ecs register-task-definition --cli-input-json "file://${next}" \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }

          migrate_arn="$(register "$MIGRATE_FAMILY")"
          echo "Registered ${migrate_arn}"
          echo "migrate=${migrate_arn}" >> "$GITHUB_OUTPUT"

          # Service name => the revision it will be moved to.
          echo '{}' > "$revisions"
          while IFS=$'\t' read -r -u 3 name family; do
            arn="$(register "$family")"
            echo "Registered ${arn}"
            jq --arg n "$name" --arg a "$arn" '.[$n] = $a' "$revisions" > "${revisions}.tmp"
            mv "${revisions}.tmp" "$revisions"
          done 3< <(jq -r '.services[] | [.name, .task_definition_family] | @tsv' "$descriptor")

      # One task migrates the schema of every module; it is the only one that
      # receives the credentials of the schema owners. It runs to completion
      # before any service is touched: if it fails, every service keeps
      # running the previous revision.
      - name: Run the schema migrations
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.register.outputs.migrate }}
          CONTAINER_NAME: ${{ steps.cfg.outputs.container }}
          SUBNETS: ${{ steps.cfg.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.cfg.outputs.migrate_security_group }}
          LOG_GROUP: ${{ steps.cfg.outputs.migrate_log_group }}
        run: |
          set -euo pipefail
          run_json="${RUNNER_TEMP}/run-task.json"
          task_json="${RUNNER_TEMP}/task.json"

          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --count 1 \
            --started-by "github-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --output json > "$run_json"

          task_arn="$(jq -r '.tasks[0].taskArn // empty' "$run_json")"
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start the migration task: $(jq -c '.failures' "$run_json")"
            exit 1
          fi
          echo "Migration task: ${task_arn}"

          deadline=$(( $(date +%s) + MIGRATION_TIMEOUT_MINUTES * 60 ))
          while :; do
            status="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].lastStatus' --output text)"
            if [ "$status" = "STOPPED" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The migration task is still ${status} after ${MIGRATION_TIMEOUT_MINUTES} minutes: ${task_arn}"
              exit 1
            fi
            echo "  ${status}"
            sleep 10
          done

          aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --output json > "$task_json"
          # exitCode is absent when the container never started (image pull or
          # secret errors); that is a failure too.
          exit_code="$(jq -r --arg c "$CONTAINER_NAME" \
            '[.tasks[0].containers[] | select(.name == $c) | .exitCode][0] | if . == null then "none" else tostring end' "$task_json")"
          stopped_reason="$(jq -r --arg c "$CONTAINER_NAME" \
            '[.tasks[0].stoppedReason, (.tasks[0].containers[] | select(.name == $c) | .reason)]
             | map(strings) | join("; ")' "$task_json")"

          echo "::group::Log of the migration task"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "migrate/${CONTAINER_NAME}/${task_arn##*/}" \
            --start-from-head --output json | jq -r '.events[].message' ||
            echo "::warning::The log of the migration task could not be read."
          echo "::endgroup::"

          if [ "$exit_code" != "0" ]; then
            echo "::error::The migration task failed (exit code: ${exit_code}; ${stopped_reason}). No service was updated."
            exit 1
          fi
          echo "Migrations applied (exit code 0)."

      # The services have the deployment circuit breaker with rollback: when
      # the new tasks do not become healthy, ECS returns to the previous
      # revision by itself. This step follows every deployment it starts and
      # stops at the first one that does not complete, so a rollback is never
      # reported as a successful release and the services after it keep the
      # revision they had.
      #
      # The order is the one of the parameter. The nucleo comes last because
      # it is the one that can STOP serving a module: it must not do so before
      # the service that takes the module over is running this release.
      - name: Roll the services
        id: roll
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          descriptor="${RUNNER_TEMP}/deploy.json"
          revisions="${RUNNER_TEMP}/revisions.json"
          service_json="${RUNNER_TEMP}/service.json"
          rolled_file="${RUNNER_TEMP}/rolled.txt"
          : > "$rolled_file"

          events() {
            echo "::group::Last events of the service"
            jq -r '.services[0].events[:15][] | "\(.createdAt)  \(.message)"' "$service_json"
            echo "::endgroup::"
          }

          not_reached() {
            local pending
            pending="$(jq -r --rawfile rolled "$rolled_file" --arg current "$1" '
              ($rolled | split("\n")) as $d
              | [.services[].name | select(. != $current and (. as $n | $d | index($n) | not))] | join(", ")' "$descriptor")"
            if [ -n "$pending" ]; then
              echo "::warning::Not deployed, still on their previous revision: ${pending}."
            fi
          }

          # Called as the condition of an `if`, where `set -e` does not apply:
          # every command that can fail returns explicitly.
          roll() {
            local name="$1" service="$2" modules="$3" task_definition deployment_id deadline state
            task_definition="$(jq -er --arg n "$name" '.[$n]' "$revisions")" || return 1

            echo "::group::${name} (modules: ${modules})"
            deployment_id="$(aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$service" \
              --task-definition "$task_definition" \
              --query "service.deployments[?status=='PRIMARY'] | [0].id" --output text)" || {
              echo "::endgroup::"
              echo "::error::The service ${service} could not be updated."
              return 1
            }
            echo "Deployment: ${deployment_id}"

            deadline=$(( $(date +%s) + ROLLOUT_TIMEOUT_MINUTES * 60 ))
            while :; do
              aws ecs describe-services --cluster "$CLUSTER" --services "$service" --output json > "$service_json" || {
                echo "::endgroup::"
                echo "::error::The service ${service} could not be read."
                return 1
              }
              state="$(jq -r --arg id "$deployment_id" \
                '[.services[0].deployments[] | select(.id == $id)][0]
                 | if . == null then "GONE" else "\(.rolloutState // "UNKNOWN") \(.runningCount)/\(.desiredCount)" end' "$service_json")"
              echo "  ${state}"

              case "$state" in
                COMPLETED*)
                  echo "::endgroup::"
                  return 0
                  ;;
                FAILED*)
                  echo "::endgroup::"
                  events
                  echo "::error::The deployment of ${name} failed and ECS is rolling it back to the previous revision."
                  return 1
                  ;;
                GONE)
                  echo "::endgroup::"
                  events
                  echo "::error::The deployment of ${name} is no longer active: it was rolled back or replaced by another one."
                  return 1
                  ;;
              esac

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::endgroup::"
                events
                echo "::error::The deployment of ${name} did not complete in ${ROLLOUT_TIMEOUT_MINUTES} minutes."
                return 1
              fi
              sleep 15
            done
          }

          while IFS=$'\t' read -r -u 3 name service modules; do
            if ! roll "$name" "$service" "$modules"; then
              not_reached "$name"
              exit 1
            fi
            echo "$name" >> "$rolled_file"
          done 3< <(jq -r '.services[] | [.name, .service, .modules] | @tsv' "$descriptor")

      # What a service created later starts with (a module that is promoted
      # next month must run this release, not the image of the first day).
      # Written only when every service completed its rollout.
      - name: Record the release
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "$RELEASE_PARAMETER" --type String --value "$TAG" --overwrite > /dev/null
          echo "${RELEASE_PARAMETER} = ${TAG}"

      - name: Summary
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          MIGRATE_TASK_DEFINITION: ${{ steps.register.outputs.migrate }}
        run: |
          set -euo pipefail
          {
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Migration task definition: \`${MIGRATE_TASK_DEFINITION}\`"
            jq -r 'to_entries[] | "- Task definition of `\(.key)`: `\(.value)`"' "${RUNNER_TEMP}/revisions.json"
            echo "- Release recorded in \`${RELEASE_PARAMETER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
