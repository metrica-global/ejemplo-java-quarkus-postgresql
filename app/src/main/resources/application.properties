# Configuration of the application. Everything that changes between environments or between
# deployments comes from an environment variable (ZC_*); the defaults below are the production
# ones.

quarkus.application.name=zonacards
quarkus.http.port=8080
quarkus.banner.enabled=false

# serve (default) or migrate: see com.zonacards.server.ZonacardsMain
zonacards.mode=${ZC_MODE:serve}
%migrate.zonacards.mode=migrate

# --- Modules --------------------------------------------------------------------------------
# The image always contains every module. ZC_MODULES says which ones THIS deployment serves:
# their API, their consumers, their outbox relay and their database connections. It has no
# default in production on purpose: a deployment must say what it is.
zonacards.modules=${ZC_MODULES}
%dev,test.zonacards.modules=lotes,giftcards
# The migration task always migrates every module.
%migrate.zonacards.modules=lotes,giftcards

# --- Database: one datasource per module, each with that module's runtime role (DML only) ----
# A module that is not served has its datasource inactive: no connections, no health check, and
# its credentials do not have to exist. zonacards.module.<name>.active is derived from
# ZC_MODULES by com.zonacards.server.ModulesConfigSourceFactory.
# Two datasources also mean that no transaction can span two modules: the transaction manager
# refuses to enlist the second one.
quarkus.datasource.lotes.db-kind=postgresql
quarkus.datasource.lotes.devservices.enabled=false
quarkus.datasource.lotes.active=${zonacards.module.lotes.active}
quarkus.datasource.lotes.jdbc.url=${ZC_DB_URL}
quarkus.datasource.lotes.username=${ZC_DB_LOTES_APP_USER:lotes_app}
quarkus.datasource.lotes.password=${ZC_DB_LOTES_APP_PASSWORD:}
quarkus.datasource.lotes.jdbc.min-size=0
quarkus.datasource.lotes.jdbc.max-size=${ZC_DB_LOTES_POOL_MAX:10}
quarkus.datasource.lotes.jdbc.acquisition-timeout=PT5S
# JDBC outside a unit of work fails instead of auto-committing.
quarkus.datasource.lotes.jdbc.transaction-requirement=strict

quarkus.datasource.giftcards.db-kind=postgresql
quarkus.datasource.giftcards.devservices.enabled=false
quarkus.datasource.giftcards.active=${zonacards.module.giftcards.active}
quarkus.datasource.giftcards.jdbc.url=${ZC_DB_URL}
quarkus.datasource.giftcards.username=${ZC_DB_GIFTCARDS_APP_USER:giftcards_app}
quarkus.datasource.giftcards.password=${ZC_DB_GIFTCARDS_APP_PASSWORD:}
quarkus.datasource.giftcards.jdbc.min-size=0
quarkus.datasource.giftcards.jdbc.max-size=${ZC_DB_GIFTCARDS_POOL_MAX:10}
quarkus.datasource.giftcards.jdbc.acquisition-timeout=PT5S
quarkus.datasource.giftcards.jdbc.transaction-requirement=strict

# --- Migrations: each module's own files, with that module's owner role ----------------------
quarkus.flyway.lotes.locations=db/lotes
quarkus.flyway.lotes.schemas=lotes
quarkus.flyway.lotes.default-schema=lotes
quarkus.flyway.lotes.create-schemas=false
quarkus.flyway.lotes.migrate-at-start=false

quarkus.flyway.giftcards.locations=db/giftcards
quarkus.flyway.giftcards.schemas=giftcards
quarkus.flyway.giftcards.default-schema=giftcards
quarkus.flyway.giftcards.create-schemas=false
quarkus.flyway.giftcards.migrate-at-start=false

# ZC_MODE=migrate activates the "migrate" profile (see ZonacardsMain). It is the only place where
# the owners' credentials are read: the long-running services never receive them, and their own
# roles cannot alter the schema.
%migrate.quarkus.flyway.lotes.jdbc-url=${ZC_DB_URL}
%migrate.quarkus.flyway.lotes.username=${ZC_DB_LOTES_OWNER_USER:lotes_owner}
%migrate.quarkus.flyway.lotes.password=${ZC_DB_LOTES_OWNER_PASSWORD}
%migrate.quarkus.flyway.lotes.migrate-at-start=true
%migrate.quarkus.flyway.giftcards.jdbc-url=${ZC_DB_URL}
%migrate.quarkus.flyway.giftcards.username=${ZC_DB_GIFTCARDS_OWNER_USER:giftcards_owner}
%migrate.quarkus.flyway.giftcards.password=${ZC_DB_GIFTCARDS_OWNER_PASSWORD}
%migrate.quarkus.flyway.giftcards.migrate-at-start=true

# --- Security: resource server, tokens issued by Keycloak -----------------------------------
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${ZC_OIDC_ISSUER:}
quarkus.oidc.token.audience=${ZC_OIDC_AUDIENCE:zonacards-api}
# Never start a throwaway Keycloak: locally the identity provider comes from docker compose.
quarkus.keycloak.devservices.enabled=false
%migrate.quarkus.oidc.tenant-enabled=false
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# --- AWS: credentials and region come from the task role; the endpoint only for the emulator -
quarkus.sqs.devservices.enabled=false
quarkus.sns.devservices.enabled=false
quarkus.sqs.sync-client.type=url
quarkus.sns.sync-client.type=url
quarkus.sqs.endpoint-override=${ZC_AWS_ENDPOINT:}
quarkus.sns.endpoint-override=${ZC_AWS_ENDPOINT:}

# --- Messaging: logical names to what Terraform created -------------------------------------
# A deployment receives only the topics and queues of the modules it serves; the rest stay
# "unset" and are never used. Modules talk to each other only through these, also when they
# run in the same process: that is what lets a module move to its own service by configuration.
zonacards.messaging.topics."lotes-events"=${ZC_TOPIC_LOTES_EVENTS_ARN:unset}
zonacards.messaging.queues."lotes-inbox"=${ZC_QUEUE_LOTES_INBOX_URL:unset}
zonacards.messaging.topics."giftcards-events"=${ZC_TOPIC_GIFTCARDS_EVENTS_ARN:unset}
zonacards.messaging.queues."giftcards-inbox"=${ZC_QUEUE_GIFTCARDS_INBOX_URL:unset}
zonacards.messaging.queues."giftcards-generacion"=${ZC_QUEUE_GIFTCARDS_GENERACION_URL:unset}
zonacards.messaging.relay.enabled=${ZC_RELAY_ENABLED:true}
zonacards.messaging.consumer.enabled=${ZC_CONSUMER_ENABLED:true}
zonacards.messaging.consumer.concurrency=${ZC_CONSUMER_CONCURRENCY:4}
zonacards.messaging.shutdown-timeout=${ZC_SHUTDOWN_TIMEOUT:PT60S}
# HTTP requests in flight get this long to finish before the event loops are stopped.
quarkus.shutdown.timeout=PT15S

# --- Module giftcards -----------------------------------------------------------------------
# Keys are secrets: Secrets Manager in AWS, never a file in the image. Only a deployment that
# serves the module receives them.
zonacards.giftcards.codigo.key=${ZC_GIFTCARDS_CODIGO_KEY:}
zonacards.giftcards.codigo.hmac-key=${ZC_GIFTCARDS_CODIGO_HMAC_KEY:}
zonacards.giftcards.argon2.memory-kib=${ZC_GIFTCARDS_ARGON2_MEMORY_KIB:19456}
zonacards.giftcards.argon2.iterations=${ZC_GIFTCARDS_ARGON2_ITERATIONS:2}
zonacards.giftcards.generacion.fragment-size=${ZC_GIFTCARDS_FRAGMENT_SIZE:1000}
zonacards.giftcards.generacion.concurrency=${ZC_GIFTCARDS_GENERACION_CONCURRENCY:2}
zonacards.giftcards.generacion.visibility-timeout=${ZC_GIFTCARDS_GENERACION_VISIBILITY:PT5M}

# --- Observability --------------------------------------------------------------------------
quarkus.log.console.json.enabled=${ZC_LOG_JSON:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# One image, several deployments: each one names itself (nucleo, giftcards...).
quarkus.otel.service.name=${OTEL_SERVICE_NAME:zonacards}
quarkus.otel.resource.attributes=service.namespace=zonacards
# A migration task lives for seconds and has nothing to trace.
%migrate.quarkus.otel.sdk.disabled=true
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*

# --- Development and tests ------------------------------------------------------------------
%dev,test.quarkus.log.console.json.enabled=false
%dev,test.quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] %s %X%e%n
%test.quarkus.otel.sdk.disabled=true
# Random port: the build container shares the network of the host.
%test.quarkus.http.test-port=0
%test.quarkus.shutdown.timeout=PT2S
%test.zonacards.messaging.shutdown-timeout=PT10S
