# Local stand-in for the Application Load Balancer: one entry point and one rule per module.
#
# Which deployment receives each module's API is not written here: it is in routes.conf, which
# scripts/topologia.sh generates. Promoting a module to its own service changes that file and
# reloads nginx (nginx -s reload), the way a promotion in AWS changes a listener rule: without
# replacing the entry point and without dropping connections.
#
# Names are resolved again every few seconds, so replicas that are added or replaced receive
# traffic without restarting the gateway.

worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=2s ipv6=off;
  access_log off;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503;
  # Only in this local gateway: which container answered. The end-to-end scenarios use it to
  # check where a module's API is being served from.
  add_header X-Zonacards-Upstream $upstream_addr always;

  server {
    listen 8080;
    default_type application/json;

    include /etc/nginx/routes/routes.conf;

    location = /healthz {
      return 200 '{"status":"UP"}';
    }

    # Like the load balancer's default action: nothing else is reachable from outside.
    location / {
      return 404 '{"code":"HTTP_404","message":"Ruta desconocida"}';
    }
  }
}
