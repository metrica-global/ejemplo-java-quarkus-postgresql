# Local stand-in for the Application Load Balancer: one entry point, one path rule per service.
# Names are resolved again every few seconds, so replicas added with
# `docker compose up --scale giftcards=N` receive traffic without restarting the gateway.

worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=2s ipv6=off;
  access_log off;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503;

  server {
    listen 8080;
    default_type application/json;

    location /api/v1/lotes {
      set $upstream http://lotes:8080;
      proxy_pass $upstream;
    }

    location /api/v1/giftcards {
      set $upstream http://giftcards:8080;
      proxy_pass $upstream;
    }

    location = /healthz {
      return 200 '{"status":"UP"}';
    }

    # Like the load balancer's default action: nothing else is reachable from outside.
    location / {
      return 404 '{"code":"HTTP_404","message":"Ruta desconocida"}';
    }
  }
}
