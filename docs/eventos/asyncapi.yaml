  schemas:
    # --- Sobre ---------------------------------------------------------------------------------
    EventEnvelope:
      title: Sobre CloudEvents 1.0
      type: object
      description: |
        Sobre de todos los mensajes: CloudEvents 1.0 en modo estructurado JSON, más tres
        atributos de extensión (`tenantid`, `correlationid`, `traceparent`). Los nombres van en
        minúsculas porque así lo pide la especificación. Los atributos sin valor se omiten; no
        se escriben como `null`.

        El lector es tolerante: ignora los atributos que no conoce. Solo rechaza un documento
        que no es JSON o al que le faltan `id` o `type`.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - tenantid
        - correlationid
        - data
      properties:
        specversion:
          type: string
          const: '1.0'
          description: Versión de CloudEvents. Siempre `1.0`.
        id:
          type: string
          format: uuid
          description: >-
            Identificador único del evento (UUID versión 7). Los consumidores deduplican por
            él: una reentrega trae el mismo `id`.
        source:
          type: string
          format: uri-reference
          enum:
            - /zonacards/lotes
            - /zonacards/giftcards
          description: Servicio que produjo el evento, como referencia URI.
        type:
          type: string
          pattern: '^zonacards\.[a-z]+\.[a-z]+(-[a-z]+)*\.v[1-9][0-9]*$'
          description: >-
            Tipo del evento, `zonacards.<dominio>.<hecho>.v<mayor>`. Viaja también como atributo
            de mensaje `type` para que el broker filtre sin leer el cuerpo.
        subject:
          type: string
          format: uuid
          description: >-
            Identificador del agregado del que habla el evento: el `loteId` o el `giftCardId`.
        time:
          type: string
          format: date-time
          description: >-
            Instante UTC en que el productor creó el evento, en ISO-8601 (por ejemplo
            `2026-11-18T15:04:05.123Z`). No es el instante de publicación ni el de entrega.
        datacontenttype:
          type: string
          const: application/json
          description: Formato de `data`. Siempre `application/json`.
        tenantid:
          type: string
          minLength: 1
          description: >-
            Extensión. Tenant dueño del agregado. Un handler solo puede tocar filas de ese
            tenant. Viaja también como atributo de mensaje `tenantid`.
        correlationid:
          type: string
          minLength: 1
          description: >-
            Extensión. Une todo lo causado por una misma petición: se fija al entrar una petición
            HTTP (cabecera `X-Request-ID` o un UUID nuevo) o al consumir un mensaje (el del
            mensaje consumido), y se copia en cada evento producido mientras se atiende.
        traceparent:
          type: string
          pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
          description: >-
            Extensión, opcional. Contexto de traza W3C del productor. Se omite cuando no hay un
            span activo. El consumidor abre su span como hijo de este.
        data:
          type: object
          description: >-
            Carga del evento. Su esquema pertenece al productor y se versiona con `type`.

    MessageAttributes:
      title: Atributos de mensaje de SNS/SQS
      type: object
      description: |
        Atributos de mensaje (`MessageAttributes`, `DataType: String`) que acompañan al cuerpo
        tanto al publicar en SNS como al enviar directo a SQS. No son parte del sobre: repiten
        dos de sus atributos para que el broker pueda enrutar sin leer el cuerpo. Con la entrega
        sin envoltura, SNS los copia como atributos del mensaje SQS.
      required:
        - type
        - tenantid
      properties:
        type:
          type: string
          description: >-
            Mismo valor que el atributo `type` del sobre. Es el atributo sobre el que filtran las
            suscripciones SNS. El consumidor despacha por el `type` del cuerpo y usa este
            atributo solo en métricas y logs.
        tenantid:
          type: string
          description: >-
            Mismo valor que el atributo `tenantid` del sobre. Hoy ningún filtro lo usa.

    # --- Tipos compartidos -----------------------------------------------------------------------
    LoteId:
      type: string
      format: uuid
      description: Identificador del lote (UUID versión 7).
    GiftCardId:
      type: string
      format: uuid
      description: Identificador de la gift card (UUID versión 7).
    Pais:
      type: string
      pattern: '^[0-9]{3}$'
      description: >-
        País en ISO 3166-1 numérico, tres dígitos (por ejemplo `604`). Es el prefijo del código
        de cada gift card.
    Moneda:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Moneda en ISO 4217, tres letras mayúsculas (por ejemplo `PEN`).
    Monto:
      type: number
      exclusiveMinimum: 0
      description: >-
        Importe de cada gift card. Número JSON escrito con exactamente dos decimales y sin
        notación exponencial (`50.00`, nunca `5E+1`, `50.0` ni una cadena). Debe leerse como
        decimal exacto, no como coma flotante binaria. El productor valida hoy que sea mayor que
        cero y como máximo `9999999.99`.
    VigenciaHasta:
      type: string
      format: date
      description: >-
        Último día de vigencia de la gift card. Fecha ISO-8601 sin hora (`AAAA-MM-DD`).

    # --- data de los eventos de lotes ------------------------------------------------------------
    LoteSolicitado:
      title: data de zonacards.lotes.lote-solicitado.v1
      type: object
      description: Record `LoteEvents.LoteSolicitado`.
      required:
        - loteId
        - pais
        - moneda
        - monto
        - cantidad
        - vigenciaHasta
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        pais:
          $ref: '#/components/schemas/Pais'
        moneda:
          $ref: '#/components/schemas/Moneda'
        monto:
          $ref: '#/components/schemas/Monto'
        cantidad:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Número de gift cards a generar. El productor valida hoy entre 1 y 200000.
        vigenciaHasta:
          $ref: '#/components/schemas/VigenciaHasta'

    LoteAnulado:
      title: data de zonacards.lotes.lote-anulado.v1
      type: object
      description: Record `LoteEvents.LoteAnulado`.
      required:
        - loteId
        - motivo
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        motivo:
          type: string
          description: >-
            Motivo indicado al anular, o `Anulado por el usuario` si no se indicó ninguno. El
            productor valida hoy un máximo de 300 caracteres.

    LoteGenerado:
      title: data de zonacards.lotes.lote-generado.v1
      type: object
      description: Record `LoteEvents.LoteGenerado`.
      required:
        - loteId
        - cantidad
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        cantidad:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Gift cards generadas: la suma de las cantidades de todos los fragmentos registrados.

    LoteFallido:
      title: data de zonacards.lotes.lote-fallido.v1
      type: object
      description: Record `LoteEvents.LoteFallido`.
      required:
        - loteId
        - motivo
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        motivo:
          type: string
          description: >-
            Texto `Fragmento <n>: <motivo>`, armado con el número y el motivo del
            `fragmento-fallido` que hizo fallar el lote.

    # --- data de los eventos de giftcards --------------------------------------------------------
    GeneracionIniciada:
      title: data de zonacards.giftcards.generacion-iniciada.v1
      type: object
      description: Record `GiftcardsEvents.GeneracionIniciada`.
      required:
        - loteId
        - totalFragmentos
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        totalFragmentos:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Número de fragmentos en que se dividió el lote: la cantidad solicitada entre el
            tamaño de fragmento, redondeando hacia arriba (1000 gift cards por fragmento por
            defecto).

    FragmentoGenerado:
      title: data de zonacards.giftcards.fragmento-generado.v1
      type: object
      description: Record `GiftcardsEvents.FragmentoGenerado`.
      required:
        - loteId
        - fragmento
        - totalFragmentos
        - cantidad
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        fragmento:
          type: integer
          format: int32
          minimum: 1
          description: Número del fragmento dentro del lote, de 1 a `totalFragmentos`.
        totalFragmentos:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Total de fragmentos del lote. Se repite en cada evento para que el consumidor pueda
            cerrar el lote aunque no haya recibido `generacion-iniciada`.
        cantidad:
          type: integer
          format: int32
          minimum: 1
          description: Gift cards generadas en este fragmento.

    FragmentoFallido:
      title: data de zonacards.giftcards.fragmento-fallido.v1
      type: object
      description: Record `GiftcardsEvents.FragmentoFallido`.
      required:
        - loteId
        - fragmento
        - motivo
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        fragmento:
          type: integer
          format: int32
          minimum: 1
          description: Número del fragmento que no pudo generarse.
        motivo:
          type: string
          description: Causa del fallo, como texto para personas.

    LoteAnuladoAplicado:
      title: data de zonacards.giftcards.lote-anulado-aplicado.v1
      type: object
      description: Record `GiftcardsEvents.LoteAnuladoAplicado`.
      required:
        - loteId
        - giftcardsAnuladas
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        giftcardsAnuladas:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Gift cards del lote que pasaron a `ANULADA` con esta anulación; las que ya estaban
            anuladas no cuentan. Es 0 cuando la anulación llegó antes de que se generara nada.

    GiftCardEmitida:
      title: data de zonacards.giftcards.giftcard-emitida.v1
      type: object
      description: Record `GiftcardsEvents.GiftCardEmitida`.
      required:
        - giftCardId
        - pais
        - moneda
        - monto
        - vigenciaHasta
      properties:
        giftCardId:
          $ref: '#/components/schemas/GiftCardId'
        pais:
          $ref: '#/components/schemas/Pais'
        moneda:
          $ref: '#/components/schemas/Moneda'
        monto:
          $ref: '#/components/schemas/Monto'
        vigenciaHasta:
          $ref: '#/components/schemas/VigenciaHasta'

    GiftCardActivada:
      title: data de zonacards.giftcards.giftcard-activada.v1
      type: object
      description: Record `GiftcardsEvents.GiftCardActivada`.
      required:
        - giftCardId
      properties:
        giftCardId:
          $ref: '#/components/schemas/GiftCardId'

    GiftCardAnulada:
      title: data de zonacards.giftcards.giftcard-anulada.v1
      type: object
      description: Record `GiftcardsEvents.GiftCardAnulada`.
      required:
        - giftCardId
        - motivo
      properties:
        giftCardId:
          $ref: '#/components/schemas/GiftCardId'
        motivo:
          type: string
          description: >-
            Motivo indicado al anular, o `Anulada por el usuario` si no se indicó ninguno. El
            productor valida hoy un máximo de 300 caracteres.

    # --- INTERNO: data del comando de giftcards --------------------------------------------------
    GenerarFragmento:
      title: INTERNO - data de zonacards.giftcards.generar-fragmento.v1
      type: object
      description: >-
        Record `GeneracionCommands.GenerarFragmento`. Interno del dominio giftcards; no es parte
        del contrato público.
      required:
        - loteId
        - fragmento
        - totalFragmentos
        - desdeSecuencia
        - cantidad
      properties:
        loteId:
          $ref: '#/components/schemas/LoteId'
        fragmento:
          type: integer
          format: int32
          minimum: 1
          description: Número del fragmento dentro del lote, de 1 a `totalFragmentos`.
        totalFragmentos:
          type: integer
          format: int32
          minimum: 1
          description: Total de fragmentos del lote.
        desdeSecuencia:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Primera posición del fragmento dentro del lote. El fragmento cubre las secuencias
            `desdeSecuencia` a `desdeSecuencia + cantidad - 1`.
        cantidad:
          type: integer
          format: int32
          minimum: 1
          description: Gift cards que debe generar este fragmento.
